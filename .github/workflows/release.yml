name: Personal Build

on:
#  push:
#    branches:
#      - master
#    paths:
#      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
      - name: Verify existing signing secrets
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEY_STORE RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required repository Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      matrix:
        product: [ app ]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Release Apk Sign
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
        run: |
          {
            printf '\n'
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf "RELEASE_STORE_FILE='./key.jks'\n"
          } >> gradle.properties
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/app/key.jks"

      - name: Unify Version Name
        run: |
          echo "统一版本号"
          sed "/^def version =/c def version = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle  -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build With Gradle
        run: |
          echo "开始进行${{ env.product }}构建"
          chmod +x gradlew
          if [[ "${{ env.product }}" == "app" ]]; then
            ./gradlew assemble${{ env.product }}release -ParmOnly=true --build-cache --parallel --daemon --warning-mode all
            mkdir -p ${{ github.workspace }}/apk/
            bash $GITHUB_WORKSPACE/.github/scripts/collect-apks.sh \
              $GITHUB_WORKSPACE/app/build/outputs/apk \
              $GITHUB_WORKSPACE/apk \
              ${{ env.product }} \
              ${{ env.VERSION }} \
              "" \
              arm
          fi
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all

      - name: Organize the Files
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          if [[ "${{ env.product }}" == "app" ]]; then
            bash $GITHUB_WORKSPACE/.github/scripts/collect-apks.sh \
              $GITHUB_WORKSPACE/app/build/outputs/apk \
              $GITHUB_WORKSPACE/apk \
              ${{ env.product }} \
              ${{ env.VERSION }} \
              "" \
              universal
          else
            cp -rf ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk ${{ github.workspace }}/apk/
          fi
          
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado_${{ env.product }}
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
          retention-days: 14

