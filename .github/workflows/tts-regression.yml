name: TTS Regression Tests

concurrency:
  group: tts-regression-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - 'work/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare Assets
        run: echo "" > "$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt"

      - name: Run TTS regression tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :app:testAppDebugUnitTest \
            --tests 'io.legado.app.service.SpeechRoleTaggerTest' \
            --tests 'io.legado.app.service.TtsSpeechChunkTest' \
            --tests 'io.legado.app.service.TtsPageFollowTest' \
            --tests 'io.legado.app.ui.book.read.ReadAloudPageHighlightTest' \
            --tests 'io.legado.app.ui.association.SharedImportAssociationTest' \
            --tests 'io.legado.app.ui.font.FontImportTest' \
            --tests 'io.legado.app.model.webBook.BookChapterUrlChangeTest' \
            --build-cache --warning-mode all

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleAppDebug -ParmOnly=true --build-cache --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-tts-debug-apk
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
